services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: harness-postgres
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      # Chỉ bind loopback: '5432:5432' mặc định bind 0.0.0.0 → mọi máy trong
      # mạng LAN đều thấy Postgres với password dev "harness".
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U harness -d harness']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
