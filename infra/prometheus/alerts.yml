# Prometheus alert rules — Spec 10 degradation/fallback governance (day-26 §3.5).
#
# Each Day-26 degradation contract is *loud* (counter + alert) and *bounded*.
# A silent fallback is a subsystem that's "down" but quietly misbehaving for
# weeks — the exact failure Spec 10 exists to prevent. These rules page when a
# fallback *rate* crosses a threshold, so a single blip does not page but a
# sustained trip to a degraded backend does.
#
# Thresholds are deliberately conservative placeholders; the Phase-3 hardening
# retrospect (day-26 §6) tunes them against real runbook SLIs. The liveness
# counters are the same surface the Day-26 failure-injection tests bump.

groups:
  - name: harness-degradation
    rules:
      # --- Semantic shadow degrading to keyword (day-26 §3.1) ------------------
      - alert: SemanticFallbackSustained
        expr: rate(harness_context_semantic_fallback_total[5m]) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Semantic context shadow is degrading to keyword"
          description: >
            {{ $value }} semantic-fallback events per second sustained over 10m.
            The embedder/provider is unavailable; the keyword path is serving, but
            the semantic shadow is no longer measuring anything.

      # --- Object-store writes degrading to the inline db backend (§3.2) -------
      - alert: ObjectStoreFallbackSustained
        expr: rate(harness_object_store_fallback_total[5m]) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Object-store writes are degrading to the inline db backend"
          description: >
            {{ $value }} object-store degradations per second sustained over 10m.
            Oversized content is being inlined into Postgres; investigate the
            object store before the db grows past what it was sized for.

      # --- Object-store failures surfacing as errors (§3.2) --------------------
      - alert: ObjectStoreErrorSustained
        expr: rate(harness_object_store_error_total[5m]) > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Object-store errors (fail-closed) are occurring"
          description: >
            {{ $value }} object-store errors per second. Content at or over the
            inline ceiling is failing to store — snapshot capture is failing
            closed, so callers are being rejected rather than silently losing bytes.

      # --- Object-store read-back integrity drift ------------------------------
      - alert: ObjectStoreIntegrityDrift
        expr: rate(harness_object_store_integrity_error_total[5m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Object-store read-backs are failing SHA-256 verification"
          description: >
            A stored object's bytes no longer hash to its content address. This is
            a data-integrity event, not an availability event — tampering or silent
            corruption, to be triaged as an incident immediately.

      # --- Sandboxed verification falling back to in-process (day-22) ----------
      - alert: SandboxFallbackSustained
        expr: rate(harness_sandbox_fallback_total[5m]) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Sandboxed verification is falling back to in-process"
          description: >
            {{ $value }} sandbox-fallback events per second sustained over 10m.
            The Docker daemon / image is unavailable, so verification is running
            without isolation. This is fail-open: degrades correctly, but must be
            triaged because isolation is the whole point (Spec 7 §5.5).