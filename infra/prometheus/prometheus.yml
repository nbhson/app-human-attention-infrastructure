# Prometheus scrape config (day-04 §2.3 / §3.4).
#
# The API serves Prometheus text at `/metrics`; in the local compose stack the
# app runs on the host, so Prometheus scrapes it via host.docker.internal — the
# "self-scrape" dashboard source operators asked for in Phase-1's audit cookbook.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Day-26 §3.5: fallback-rate alerting lives beside the scrape config so a
# degraded subsystem pages instead of quietly misbehaving (Spec 10). The whole
# `infra/prometheus/` directory is bind-mounted at `/etc/prometheus`, so
# `alerts.yml` resolves relative to this file.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: harness
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: harness-api